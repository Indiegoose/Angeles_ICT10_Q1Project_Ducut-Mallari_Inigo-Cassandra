<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ducut & Mallari SKU Project</title>

    <link rel="stylesheet" 
     href="https://pyscript.net/releases/2025.2.4/core.css">

    <script type="module"
     src="https://pyscript.net/releases/2025.2.4/core.js"></script>

    <style>

        body {
            background-image: url('PROJECT.BACKGROUND.jpg'); 
            background-size: cover;                  
            background-position: center;            
            background-repeat: no-repeat;           
            background-attachment: fixed;           
            line-height: 1.6;
            padding-bottom: 40px;
            box-sizing: border-box;
            font-family: "Segoe UI", Helvetica;

        }

        nav { 
            padding: 20px 32px 30px;
            box-shadow: 0 2px 8px rgb(146, 176, 251);
            margin-bottom: 40px;
            background-image: radial-gradient(circle at 15px 0, #ffffff 15px, #ffb9d3 16px);
            background-size: 30px 100%;
            background-repeat: repeat-x;
        }

        nav div a {
            color: #ffffff;
            text-decoration: underline wavy #f7b3e1;
            font-weight: 600;
            font-size: 17.6px;
            letter-spacing: 0.5px;
        }

        nav div a:hover {
            color: #8ad0ff;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            background: rgb(255, 188, 215);
            padding: 32px;
            border-radius: 40px;
            box-shadow: 0 4px 16px #f885b5;
            display: flex;
            flex-direction: column;
        }

        .header {
            margin-bottom: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 28.8px;
            color: #ffffff;
            padding-bottom: 18px;
            position: relative;
        }

        .header h1::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 12px;
            background-image: radial-gradient(circle at 8px 0, #ffff 8px, transparent 9px);
            background-size: 16px 100%;
            background-repeat: repeat-x;
        }

        label {
            font-weight: 600;
            font-size: 14.4px;
            color: #fa9abd;
            margin-top: 16px;
            margin-bottom: 6px;
        }

        select, input[type="number"] {
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 50px;
            font-size: 15.2px;
            color: #3d7ba8;
            background-color: #f8fafc;
            outline: none;
            transition: all 0.2s ease;
        }

        select { width: 100%; }
        input[type="number"] { width: 30%; }

        button {
            margin-top: 28px;
            padding: 14px;
            background-color: #86caf6;
            color: #4eaaeb;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #2980b9;
        }

        .output {
            margin-top: 24px;
            padding: 16px;
            background-color: #f1f5f9;
            border-left: 4px solid #75bded;
            border-radius: 4px;
            text-align: center;
            font-weight: 600;
            color: #4eaaeb;
        }

        footer {
            margin-top: 50px;
            padding: 30px 20px 20px;
            text-align: center;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            background-image: radial-gradient(circle at 15px 0, #ffff 15px, #ffb9d3 16px);
            background-size: 30px 100%;
            background-repeat: repeat-x;
        }

    </style>
</head>
<body>

    <nav>
        <br>
        <div>
            <a href="index.html">★ SKU Generator ★</a>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>🍰ྀི M&D Generator 🍪ྀི</h1>
        </div>

        <label for="category">Category</label>
        <select id="category">
            <option value="Cookies">Cookies</option>
            <option value="Pastries">Pastries</option>
        </select>

<label for="product_name">Product Name</label>
        <select id="product_name">
            <option value="Chocolate Chip Cookie">Chocolate Chip Cookie</option>
            <option value="Oatmeal Raisin Cookie">Oatmeal Raisin Cookie</option>
            <option value="Red Velvet Cookie">Red Velvet Cookie</option>
            <option value="Double Chocolate Cookie">Double Chocolate Cookie</option>
            <option value="Butter Croissant">Butter Croissant</option>
            <option value="Cinnamon Roll">Cinnamon Roll</option>
            <option value="Blueberry Muffin">Blueberry Muffin</option>
        </select>

        <label for="stock">Stock Quantity</label>
        <input type="number" id="stock" placeholder="ex. 100">

        <button py-click="generate"><b>Generate</b></button>

        <div class="output" id="sku-output">Your generated SKU will appear here</div>
    </div>

    <footer>
        <p>★ (OBMC 26-27) Ducut & Mallari SKU Generator Project ★</p>
    </footer>

    <script type="py" src="main.py"></script>
</body>
</html>
